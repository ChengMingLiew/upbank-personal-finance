x-api-common: &api-common
  build:
    context: ../apps/api
  image: accounts-api:local
  env_file: ../apps/api/.env
  environment:
    DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/postgres-db
    REDIS_URL: redis://:redis_password@redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  db:
    image: postgres:16-alpine
    container_name: accounts-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres-db
    ports:
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres-db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: accounts-redis
    restart: unless-stopped
    command: redis-server --requirepass redis_password --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "redis_password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    <<: *api-common
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  worker:
    <<: *api-common
    command: celery -A src.jobs.celery_app worker --loglevel=info --concurrency=2

  beat:
    <<: *api-common
    command: celery -A src.jobs.celery_app beat --loglevel=info
      
volumes:
  postgres_data:
  redis_data: