x-api-common: &api-common
  image: accounts-api:local
  restart: unless-stopped
  env_file: ../apps/api/.env
  environment:
    DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/postgres-db
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  db:
    image: postgres:16-alpine
    container_name: accounts-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres-db
    ports:
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres-db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: accounts-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    <<: *api-common
    build:
      context: ../apps/api
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  worker:
    <<: *api-common
    container_name: accounts-worker
    command: celery -A src.jobs.celery_app worker --loglevel=info --pool=threads --concurrency=4

  beat:
    <<: *api-common
    container_name: accounts-beat
    command: celery -A src.jobs.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
      
volumes:
  postgres_data:
  redis_data: